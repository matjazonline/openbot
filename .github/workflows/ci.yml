name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_bots_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_bots_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_bots_test
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify local-agent plugin and build counted test peers
        run: |
          npm --prefix integrations/cloudroom-plugin ci
          npm --prefix integrations/cloudroom-plugin run typecheck
          npm --prefix integrations/cloudroom-plugin run build
          npm --prefix integrations/cloudroom-plugin test
          npm --prefix integrations/cloudroom-plugin run test:guards
      - name: Reproducible local-agent package and locked runtime installation
        run: |
          npm --prefix integrations/cloudroom-plugin run package
          package_dir="$(mktemp -d)"
          tar -xzf integrations/cloudroom-plugin/artifacts/bb-plugin-openbot-local-0.2.0.tgz -C "$package_dir" --strip-components=1
          npm --prefix "$package_dir" ci --omit=dev
      - name: Generated CSS is current
        run: npm run check:css
      - name: Install browser for protocol tests
        run: npx playwright install --with-deps chromium
      - name: Run counts browser protocol
        run: npm run test:run-counts
      - name: SSE navigation lifecycle
        run: node --test scripts/tests/sse-navigation.mjs scripts/tests/agent-runtime.mjs scripts/tests/channel-response-authoring.mjs scripts/tests/workflow-runs.mjs scripts/tests/workflow-conversations.mjs scripts/tests/workflow-samples.mjs
      - name: Deployment script tests
        run: |
          scripts/tests/deploy.sh
          scripts/tests/credential-key-rotation.sh
      - name: Knowledge artifact preparation tests
        run: python3 scripts/tests/knowledge-model-prepare.py
      - name: Disposable Doop test runner boundaries
        run: |
          python3 scripts/tests/doop-test.py
          node --test scripts/tests/doop-probe.mjs
      - name: Knowledge model production image and early memory budget
        run: |
          docker build --tag openbot-knowledge-ci .
          python3 scripts/check-knowledge-image.py --image openbot-knowledge-ci
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Patch whitespace
        run: git diff --check
      - name: Transport abstraction boundary
        run: |
          scripts/tests/transport-boundary.sh
          scripts/transport-boundary-check.sh
          python3 scripts/tests/workflow-sample-boundary.py
          python3 scripts/workflow-sample-boundary.py
          python3 scripts/tests/integration-boundary.py
          python3 scripts/integration-boundary.py
          python3 scripts/check-integration-docs.py
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Workflow evidence retention
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/tests/workflow-evidence.py
          python3 scripts/check-workflow-evidence.py --tracked-manifests --require-tracked
      - name: Offline compilation
        run: cargo check --locked --offline --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked
      - name: Enable pg_stat_statements in CI PostgreSQL
        run: |
          container="$(docker ps --filter ancestor=postgres:18.6-bookworm --format '{{.ID}}' | head -n 1)"
          test -n "$container"
          docker exec "$container" psql -U postgres -d open_bots_test -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'" \
            -c "ALTER SYSTEM SET compute_query_id = 'on'" \
            -c "ALTER SYSTEM SET log_parameter_max_length = '0'" \
            -c "ALTER SYSTEM SET log_parameter_max_length_on_error = '0'"
          docker restart "$container"
          until docker exec "$container" pg_isready -U postgres -d open_bots_test; do sleep 1; done
          docker exec "$container" psql -U postgres -d open_bots_test -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET pg_stat_statements.track = 'top'" \
            -c "ALTER SYSTEM SET pg_stat_statements.track_utility = 'off'" \
            -c "SELECT pg_reload_conf()"
      - name: Migrations
        env:
          SQLX_OFFLINE: "false"
        run: cargo sqlx migrate run
      - name: Query statistics activation
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -c "SELECT 1 AS ci_pg_stat_statements_probe"
          test "$(psql "$DATABASE_URL" -X -Atqc "SHOW pg_stat_statements.track")" = "top"
          test "$(psql "$DATABASE_URL" -X -Atqc "SHOW pg_stat_statements.track_utility")" = "off"
          test "$(psql "$DATABASE_URL" -X -Atqc "SHOW log_parameter_max_length")" = "0"
          test "$(psql "$DATABASE_URL" -X -Atqc "SHOW log_parameter_max_length_on_error")" = "0"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc \
            "SELECT queryid FROM pg_stat_statements WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database()) AND query LIKE '%ci_pg_stat_statements_probe%' LIMIT 1" \
            | grep -Eq '^-?[0-9]+$'
      - name: SQLx metadata matches migrated schema
        env:
          SQLX_OFFLINE: "false"
        run: cargo sqlx prepare --check -- --all-targets
      - name: Compile tests before denying network access
        run: cargo test --locked --offline --all-targets --no-run
      - name: Integration conformance families are registered
        run: |
          for family in integration_portability_ integration_service_contract_ vault_google_e2e_; do
            cargo test --locked --offline --lib "$family" -- --list > /tmp/integration-conformance-list
            grep -Eq ': test$' /tmp/integration-conformance-list
          done
      - name: Vault authoring browser protocol
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_bots_test
          VAULT_AUTHORING_BROWSER_FIXTURES: /tmp/vault-authoring-browser
        run: |
          cargo test --locked --offline --lib vault_authoring_picker_is_owner_scoped_and_only_exposes_approved_metadata
          cargo test --locked --offline --lib vault_authoring_owner_forms_and_reconnect_states_emit_real_browser_markup
          node --test scripts/tests/vault-authoring-browser.mjs
      - name: Rust source module reachability
        run: cargo test --locked --offline --test source_modules
      - name: HTML rendering and team autocomplete browser protocol
        env:
          HTML_INJECTION_BROWSER_FIXTURES: /tmp/html-injection-browser
          APP_JS_OUT: /tmp/html-injection-browser/app.js
        run: |
          cargo test --locked --offline --lib dump_html_injection_browser_fixtures -- --ignored
          node --test scripts/tests/team-autocomplete-browser.mjs scripts/tests/html-injection-browser.mjs
      - name: Knowledge library native form browser protocol
        env:
          KNOWLEDGE_BROWSER_FIXTURES: /tmp/knowledge-browser
        run: |
          cargo test --locked --offline --lib dump_knowledge_browser_fixtures -- --ignored
          node --test scripts/tests/knowledge-browser.mjs
      - name: Agent authoring browser protocol
        env:
          AGENT_AUTHORING_BROWSER_FIXTURES: /tmp/agent-authoring-browser
        run: |
          cargo test --locked --offline --lib dump_autonomous_agent_authoring_browser_fixtures -- --ignored
          node --test scripts/tests/agent-authoring-browser.mjs
      - name: Local agent management browser protocol
        env:
          CLOUDROOM_MANAGEMENT_BROWSER_FIXTURES: /tmp/cloudroom-management-browser
        run: |
          cargo test --locked --offline --lib dump_cloudroom_management_browser_fixtures -- --ignored
          node --test scripts/tests/local-agents-browser.mjs
      - name: Workflow agent selection browser protocol
        env:
          WORKFLOW_AGENT_BROWSER_FIXTURES: /tmp/workflow-agent-browser
        run: |
          cargo test --locked --offline --lib dump_autonomous_workflow_agent_picker_browser_fixtures -- --ignored
          node --test scripts/tests/workflow-agent-picker-browser.mjs
      - name: Session revocation browser protocol
        env:
          SESSION_REVOCATION_BROWSER_FIXTURES: /tmp/session-revocation-browser
        run: |
          cargo test --locked --offline --lib dump_session_revocation_browser_fixtures -- --ignored
          node --test scripts/tests/session-revocation-browser.mjs
      - name: Database-backed test suite (isolated network)
        run: scripts/test-network-isolation.sh cargo test --locked --offline --all-targets
      - name: Decision browser forms
        env:
          WORKFLOW_DECISION_BROWSER_FIXTURES: /tmp/workflow-decision-browser
        run: |
          cargo test --locked --offline --lib decision_browser_markup_and_closed_draft_recovery
          cargo test --locked --offline --lib source_message_outside_window_is_exact_and_authorized
          node --test scripts/tests/workflow-decisions.mjs
      # .cargo/config.toml gives every test thread 16 MiB, which is what keeps the
      # task-worker -> dispatch -> agent-runner chain off the guard page -- and which would also
      # let that chain grow twelvefold before anything complained. Re-run the suite at the stack a
      # thread gets by default, so growth is a red build rather than a crash months later.
      - name: Stack budget
        run: scripts/test-network-isolation.sh scripts/stack-budget.sh --offline
      # The workflow persistence bounds (LeasePolicy::attempt_bound) were raised past the old
      # fixed second, which removed the signal that they were being approached. Re-run the
      # lease, action and budget suites uncontended and fail when an operation's code-owned
      # work (its statements after the leading locks) nears its bound; lock waits, acquire,
      # commit and unknown outcomes are reported, not gated (contention and host IO).
      - name: Lease budget
        run: scripts/test-network-isolation.sh scripts/lease-budget.sh --offline

  doop-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_bots_doop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_bots_doop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_bots_doop_test
      SQLX_OFFLINE: "true"
      DOOP_TEST_UI_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doop-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the ordinary sandboxed system browser
        run: |
          test -x "$DOOP_TEST_UI_CHROME"
          "$DOOP_TEST_UI_CHROME" --version
      - name: Prepare the pinned managed Doop source and dependencies
        run: python3 scripts/doop-test.py setup --managed --directory "$RUNNER_TEMP/doop"
      - name: Complete separate Doop service gate without inherited credentials
        run: |
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import subprocess
          spec = importlib.util.spec_from_file_location("doop_gate", "scripts/doop-test.py")
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          setup = Path(os.environ["RUNNER_TEMP"]) / "doop"
          source, manifest, identity = runner.select_source(setup, None, None, True)
          home = Path(os.environ["RUNNER_TEMP"]) / "doop-service-gate-home"
          (home / "tmp").mkdir(mode=0o700, parents=True)
          environment = runner.clean_environment(home)
          environment["PATH"] = str(setup / "tools/node_modules/.bin") + os.pathsep + environment["PATH"]
          environment["CHROME_PATH"] = os.environ["DOOP_TEST_UI_CHROME"]
          environment["DOOP_TEST_DATABASE_URL"] = os.environ["DATABASE_URL"]
          bun = str(setup / "tools/node_modules/.bin/bun")
          commands = [[bun, "install", "--frozen-lockfile", "--ignore-scripts"]]
          commands += [[bun, "run", name] + (["--", "--maxWorkers=2"] if name == "test" else [])
              for name in ("format:check", "typecheck", "lint", "doc-lint", "test", "build")]
          for command in commands:
              print("Doop gate:", " ".join(command), flush=True)
              subprocess.run(command, cwd=source, env=environment, check=True, timeout=1200)
          runner.reviewed_source(source, identity["fingerprint"], manifest)
          PY
      - name: Compile and retain the exact Openbot helper executable
        run: |
          cargo fetch --locked
          cargo test --locked --offline --lib --no-run --message-format=json > "$RUNNER_TEMP/doop-libtest-build.jsonl"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          root = Path(os.environ["RUNNER_TEMP"])
          messages = [json.loads(line) for line in (root / "doop-libtest-build.jsonl").read_text().splitlines()]
          binaries = [message["executable"] for message in messages
              if message.get("reason") == "compiler-artifact" and message.get("executable")
              and message["target"]["name"] == "open_bots" and message["target"]["kind"] == ["lib"]
              and message["profile"]["test"]]
          assert len(binaries) == 1, "exactly one current libtest executable is required"
          helper = root / "openbot-doop-libtest"
          shutil.copy2(binaries[0], helper)
          helper.chmod(0o500)
          names = subprocess.check_output([str(helper), "--list"], text=True).splitlines()
          for expected in ("doop_live_company_setup", "doop_lifecycle_live_company_keys", "doop_e2e_live_company_documents"):
              assert sum(name.endswith("::" + expected + ": test") for name in names) == 1, expected
          digest = hashlib.sha256()
          with helper.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""): digest.update(chunk)
          (root / "doop-libtest-sha256.txt").write_text(digest.hexdigest() + "\n")
          PY
      - name: Prepare the pinned private deployment dependencies and image
        run: |
          docker pull postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
          docker pull dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
          python3 scripts/doop-test.py image --managed --directory "$RUNNER_TEMP/doop" --output "$RUNNER_TEMP/doop-image"
      - name: Require both private storage modes and both actual probe families
        run: |
          python3 scripts/doop-test.py acceptance --directory "$RUNNER_TEMP/doop" \
            --image "$RUNNER_TEMP/doop-image/image.json" --output "$RUNNER_TEMP/doop-acceptance" \
            --openbot-test-binary "$RUNNER_TEMP/openbot-doop-libtest" \
            --openbot-test-database "$DATABASE_URL" --ui-chrome "$DOOP_TEST_UI_CHROME"
      - name: Retain sanitized source image helper and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doop-integration-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/doop-libtest-sha256.txt
            ${{ runner.temp }}/doop-image/image.json
            ${{ runner.temp }}/doop-acceptance
