name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mail_agents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mail_agents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mail_agents_test
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Generated CSS is current
        run: npm run check:css
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Offline compilation
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked
      - name: Enable pg_stat_statements in CI PostgreSQL
        run: |
          container="$(docker ps --filter ancestor=postgres:18.6-bookworm --format '{{.ID}}' | head -n 1)"
          test -n "$container"
          docker exec "$container" psql -U postgres -d mail_agents_test -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'" \
            -c "ALTER SYSTEM SET compute_query_id = 'on'" \
            -c "ALTER SYSTEM SET log_parameter_max_length = '0'" \
            -c "ALTER SYSTEM SET log_parameter_max_length_on_error = '0'"
          docker restart "$container"
          until docker exec "$container" pg_isready -U postgres -d mail_agents_test; do sleep 1; done
          docker exec "$container" psql -U postgres -d mail_agents_test -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET pg_stat_statements.track = 'top'" \
            -c "ALTER SYSTEM SET pg_stat_statements.track_utility = 'off'" \
            -c "SELECT pg_reload_conf()"
      - name: Migrations
        env:
          SQLX_OFFLINE: "false"
        run: cargo sqlx migrate run
      - name: Query statistics activation
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -c "SELECT 1 AS ci_pg_stat_statements_probe"
          test "$(psql "$DATABASE_URL" -X -Atqc "SHOW pg_stat_statements.track")" = "top"
          test "$(psql "$DATABASE_URL" -X -Atqc "SHOW pg_stat_statements.track_utility")" = "off"
          test "$(psql "$DATABASE_URL" -X -Atqc "SHOW log_parameter_max_length")" = "0"
          test "$(psql "$DATABASE_URL" -X -Atqc "SHOW log_parameter_max_length_on_error")" = "0"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc \
            "SELECT queryid FROM pg_stat_statements WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database()) AND query LIKE '%ci_pg_stat_statements_probe%' LIMIT 1" \
            | grep -Eq '^-?[0-9]+$'
      - name: Database-backed test suite
        run: cargo test --locked --all-targets
      # .cargo/config.toml gives every test thread 16 MiB, which is what keeps the
      # task-worker -> dispatch -> agent-runner chain off the guard page -- and which would also
      # let that chain grow twelvefold before anything complained. Re-run the suite at the stack a
      # thread gets by default, so growth is a red build rather than a crash months later.
      - name: Stack budget
        run: scripts/stack-budget.sh
