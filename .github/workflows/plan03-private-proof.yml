name: Plan03 corrected private acceptance
on: [push]
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  doop-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_bots_doop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_bots_doop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_bots_doop_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_bots_doop_test
      SQLX_OFFLINE: "true"
      DOOP_TEST_UI_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doop-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable OCI image export and import
        uses: docker/setup-docker-action@v4
        with:
          version: v29.9.3
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Fetch locked OpenBot dependencies
        run: cargo fetch --locked
      - name: Managed Doop service and private integration
        run: |
          python3 - <<'PYPROOF'
          import importlib.util, os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('check_doop','scripts/check-doop.py');check=importlib.util.module_from_spec(spec);spec.loader.exec_module(check)
          spec=importlib.util.spec_from_file_location('doop_runner','scripts/doop-test.py');runner=importlib.util.module_from_spec(spec);spec.loader.exec_module(runner)
          output=Path(os.environ['RUNNER_TEMP'])/'doop-check';output.mkdir(mode=0o700)
          setup=output/'source';chrome=os.environ['DOOP_TEST_UI_CHROME'];database=os.environ['TEST_DATABASE_URL']
          check.run(chrome,'--version')
          check.run('python3','scripts/doop-test.py','setup','--managed','--directory',str(setup))
          source,manifest,identity=runner.select_source(setup,None,None,True)
          home=output/'browser-check-home';(home/'tmp').mkdir(mode=0o700,parents=True)
          env=runner.clean_environment(home);env['CHROME_PATH']=chrome
          check.run('node','scripts/doop-test/browser-ipc-check.mjs',str(source),str(output),env=env)
          helper=check.compile_helper(output)
          for image in ('postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395','dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5'):
              check.run('docker','pull',image)
          check.run('python3','scripts/doop-test.py','image','--managed','--directory',str(setup),'--output',str(output/'image'))
          check.run('python3','scripts/doop-test.py','acceptance','--directory',str(setup),'--image',str(output/'image/image.json'),'--output',str(output/'acceptance'),'--openbot-test-binary',str(helper),'--openbot-test-database',database,'--ui-chrome',chrome)
          PYPROOF

      - name: Retain sanitized source image helper and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doop-integration-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/doop-check/service-gate-*.log
            ${{ runner.temp }}/doop-check/browser-ipc-check.json
            ${{ runner.temp }}/doop-check/libtest-build.jsonl
            ${{ runner.temp }}/doop-check/libtest-sha256.txt
            ${{ runner.temp }}/doop-check/image/image.json
            ${{ runner.temp }}/doop-check/acceptance
