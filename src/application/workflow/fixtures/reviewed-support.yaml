# The agent base with a review gate before the reply, as `AgentWorkflow::reviewed` composes it.
# The catalogue ships the composed source; the templates tests keep this copy equal to it.
format_version: 1
workflow_id: 00000000-0000-0000-0000-000000000001
input_schema:
  type: object
  properties:
    message: {type: string}
    source_message: {type: string, maxLength: 128}
    subject: {type: string, maxLength: 998}
    sender: {type: string, maxLength: 320}
  required: [message, source_message]
  additionalProperties: false
parameter_schema:
  type: object
  properties:
    reviewer: {type: string, maxLength: 128}
  required: [reviewer]
  additionalProperties: false
output_schema:
  type: object
  properties: {body: {type: string, maxLength: 16384}, review: {type: object}}
  required: [body]
  additionalProperties: false
resources: []
entry: context
steps:
  context:
    type: context.history
    with:
      max_tokens: {literal: 8000}
    routes: {success: draft}
  draft:
    type: agent.run
    with:
      agent: {literal: assistant}
      context:
        object:
          untrusted_message: {ref: /input/message}
          untrusted_subject: {default: {ref: /input/subject, value: {literal: ""}}}
          untrusted_history: {ref: /steps/context/output}
      output_schema:
        literal:
          type: object
          properties: {body: {type: string, maxLength: 16384}}
          required: [body]
          additionalProperties: false
    routes: {success: review}
  review:
    type: decision.human
    with:
      proposal: {ref: /steps/draft/output}
      reviewers: {array: [{object: {kind: {literal: principal}, id: {ref: /params/reviewer}}}]}
      deadline: {ref: /run/deadline}
      data_schema:
        literal:
          type: object
          properties: {body: {type: string, maxLength: 16384}}
          required: [body]
          additionalProperties: false
      feedback_required: {literal: [reject]}
    routes: {choices: {approve: reply, reject: review_rejected}}
  reply:
    type: data.map
    with:
      value: {ref: /steps/review/output/data}
      output_schema:
        literal:
          type: object
          properties: {body: {type: string, maxLength: 16384}}
          required: [body]
          additionalProperties: false
    routes: {success: $end}
  review_rejected:
    type: channel.no_reply
    with:
      value:
        object:
          body: {literal: ""}
          review: {ref: /steps/review/output}
      output_schema:
        literal:
          type: object
          properties: {body: {type: string, maxLength: 16384}, review: {type: object}}
          required: [body]
          additionalProperties: false
    routes: {success: $end}
limits: {max_steps: 10, max_context_bytes: 65536}
