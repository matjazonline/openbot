format_version: 1
workflow_id: 00000000-0000-0000-0000-000000000001
input_schema:
  type: object
  properties:
    message: {type: string}
    source_message: {type: string, maxLength: 128}
    subject: {type: string, maxLength: 998}
    sender: {type: string, maxLength: 320}
  required: [message, source_message]
  additionalProperties: false
parameter_schema:
  type: object
  properties:
    reviewer: {type: string, maxLength: 128}
  required: [reviewer]
  additionalProperties: false
output_schema: true
resources: []
entry: draft
steps:
  draft:
    type: agent.run
    with:
      agent: {literal: assistant}
      context: {object: {untrusted_message: {ref: /input/message}}}
      output_schema:
        literal:
          type: object
          properties: {body: {type: string, maxLength: 16384}}
          required: [body]
          additionalProperties: false
    routes: {success: review}
  review:
    type: decision.human
    with:
      proposal: {ref: /steps/draft/output}
      reviewers: {array: [{object: {kind: {literal: user}, id: {ref: /params/reviewer}}}]}
      deadline: {ref: /run/deadline}
      data_schema:
        literal:
          type: object
          properties: {body: {type: string, maxLength: 16384}}
          required: [body]
          additionalProperties: false
      feedback_required: {literal: [reject]}
    routes: {choices: {approve: reply, reject: $end}}
  reply:
    type: message.reply
    with:
      source_message: {ref: /input/source_message}
      content: {ref: /steps/review/output/data}
    routes: {success: $end}
limits: {max_steps: 10, max_context_bytes: 65536}
