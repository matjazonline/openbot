# A department lead's desk: the agent base run by the agent `lead`. The workflow adds nothing for
# the department: a run on a department-owned desk gets the department's name, charter, its lead
# sentence and the desks around it as trusted system text from preparation (01DEP-P03-D11), and
# the context below stays untrusted message data. Handing work to another desk waits for
# `channel.call` (01DEP-C004): a message sent to a desk does not start that desk's workflow.
format_version: 1
workflow_id: 00000000-0000-0000-0000-000000000008
input_schema:
  type: object
  properties:
    message: {type: string}
    source_message: {type: string, maxLength: 128}
    subject: {type: string, maxLength: 998}
    sender: {type: string, maxLength: 320}
  required: [message, source_message]
  additionalProperties: false
parameter_schema: {type: object, additionalProperties: false}
output_schema:
  type: object
  properties: {body: {type: string, maxLength: 16384}}
  required: [body]
  additionalProperties: false
resources: []
entry: context
steps:
  context:
    type: context.history
    with:
      max_tokens: {literal: 8000}
    routes: {success: lead}
  lead:
    type: agent.run
    with:
      agent: {literal: lead}
      context:
        object:
          untrusted_message: {ref: /input/message}
          untrusted_subject: {default: {ref: /input/subject, value: {literal: ""}}}
          untrusted_history: {ref: /steps/context/output}
      output_schema:
        literal:
          type: object
          properties: {body: {type: string, maxLength: 16384}}
          required: [body]
          additionalProperties: false
    routes: {success: reply}
  reply:
    type: data.map
    with:
      value: {ref: /steps/lead/output}
      output_schema:
        literal:
          type: object
          properties: {body: {type: string, maxLength: 16384}}
          required: [body]
          additionalProperties: false
    routes: {success: $end}
limits: {max_steps: 10, max_context_bytes: 65536}
