<!DOCTYPE html>
<html lang="en" data-theme="dark" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"(408|413|429|503)","swap":true,"error":true},{"code":"[45]..","swap":false,"error":true}]}'>
    <title>Register - Mail Agents</title>
    <link href="/assets/app.css?v=cf44aa2d08a95bde" rel="stylesheet" type="text/css" />
    <style>
        .loading-spinner {
            -webkit-mask-image: none;
            mask-image: none;
            background-color: transparent;
            box-sizing: border-box;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-rotate 0.7s linear infinite;
        }
        @keyframes spinner-rotate { to { transform: rotate(360deg); } }

        .loading-dots { animation: loading-fade 1.2s ease-in-out infinite; }
        @keyframes loading-fade { 50% { opacity: 0.35; } }

        /* An icon-only button has no room beside its glyph, so the spinner stands in for it
           rather than crowding in next to it. */
        [data-busy-icon-only] > :not([data-request-spinner]) { display: none !important; }

        @media (prefers-reduced-motion: reduce) {
            .loading-spinner { animation-duration: 2s; }
            .loading-dots { animation-duration: 3s; }
        }

        [data-theme="dark"] {
            --color-primary: oklch(50% 0.19 264.05);
            --color-primary-content: oklch(96% 0.02 264.05);
        }
        :root, [data-theme] { --radius-field: .5rem !important; }
        .input:focus, .input:focus-within { outline-offset: -1px; }
    </style>
    <script src="/assets/htmx-2.0.4.min.js" defer></script>
</head>
<body class="min-h-full bg-base-100 text-base-content">
    <div class="mx-auto flex min-h-screen w-full max-w-5xl flex-col px-4 py-6 sm:px-6 lg:px-8">
        <nav class="navbar min-h-0 px-0">
            <div class="flex-1">
                <a href="/login" title="BusyBots">
                    <img src="/assets/busybots-logo-light.png?v=b6b75fa297b67777" alt="BusyBots" class="h-10 w-auto">
                </a>
            </div>
            <div class="flex-none gap-2">
                <a href="/login" class="btn btn-ghost btn-sm">Sign in</a>
                <a href="/register" class="btn btn-primary btn-sm">Sign up</a>
            </div>
        </nav>

        <main class="flex flex-1 items-center justify-center py-10">
            <div class="card w-full max-w-md border border-base-300 bg-base-200 shadow-2xl">
                <div class="card-body p-6 sm:p-8">
                    
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold">Create an account</h1>
            <p class="mt-2 text-sm text-base-content/60">Get started with BusyBots.</p>
        </div>

        <div id="response-message"></div>

        

        <form hx-post="/api/user/register" hx-target="#response-message" hx-swap="innerHTML" class="space-y-4">
            <fieldset class="fieldset">
                <label for="username" class="fieldset-legend">Username</label>
                <input type="text" id="username" name="username" required
                    autocomplete="username" class="input w-full" placeholder="johndoe">
            </fieldset>

            <fieldset class="fieldset">
                <label for="email" class="fieldset-legend">Email address</label>
                <input type="email" id="email" name="email" required
                    autocomplete="email" class="input w-full" placeholder="you@example.com">
            </fieldset>

            <fieldset class="fieldset">
                <label for="password" class="fieldset-legend">Password</label>
                <input type="password" id="password" name="password" required
                    autocomplete="new-password" class="input w-full" placeholder="Create a password">
            </fieldset>

            <fieldset class="fieldset">
                <label for="confirm_password" class="fieldset-legend">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    autocomplete="new-password" class="input w-full" placeholder="Repeat your password">
            </fieldset>

            <button type="submit" class="btn btn-primary mt-2 w-full">Create account</button>
        </form>

        <div class="mt-6 text-center text-sm text-base-content/60">
            Already have an account?
            <a href="/login" class="link link-primary ml-1 font-medium">Sign in</a>
        </div>
    
                </div>
            </div>
        </main>
    </div>
</body>
</html>
