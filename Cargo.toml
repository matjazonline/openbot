[package]
name = "mail_agents"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "chrono", "json"] }
dotenvy = "0.15"
tower = "0.5"
anyhow = "1"
argon2 = "0.5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std", "json"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
secrecy = { version = "0.10", features = ["serde"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }
chrono = { version = "0.4.41", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1.89"
axum-extra = { version = "0.10", features = ["cookie"] }
time = "0.3"
ai-agents = { git = "https://github.com/geminik23/ai-agents.git" }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport"] }
htmd = "0.1"
mail-parser = "0.9"
mail-auth = "0.6"
sha2 = "0.10"
serde_yaml = "0.9"
schemars = "1"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
url = "2"
pulldown-cmark = "0.13"
ammonia = "4"
base64 = "0.22"
ring = "0.17"
# RS256 for the Google service-account assertion that buys a Cloud Storage access token.
jsonwebtoken = "9"
chrono-tz = "0.10.4"

[dev-dependencies]
# `#[tokio::test(start_paused = true)]`, so lease-heartbeat tests run in virtual time instead of
# sleeping through a real 15-minute lease term.
tokio = { version = "1", features = ["full", "test-util"] }
