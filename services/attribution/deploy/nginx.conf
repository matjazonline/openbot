pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    access_log off; # Default access logs include sensitive callback/query values.
    error_log /dev/stderr crit;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 5s;
    server {
        listen 8443 ssl;
        server_name attribution.example.com;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://application:8091;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-User "";
            proxy_read_timeout 15s;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_buffering off;
        }
    }
}
